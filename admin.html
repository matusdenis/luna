<!doctype html>
<html lang="sk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Administrácia – Luna</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 60 60'%3E%3Cpath d='M38 6a24 24 0 1 0 16 38A20 20 0 0 1 38 6Z' fill='%23f6c66a'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/fonts.css">
  <link rel="stylesheet" href="css/luna.css">
  <style>
    body { background: #eef0f8; color: var(--ink); }
    .adm-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
      padding: 12px 24px; background: linear-gradient(90deg, var(--night-1), var(--night-3)); color: #fff; }
    .adm-top .logo span { font-size: 38px; }
    .adm-top small { font-family: var(--f-display); letter-spacing: .15em; color: var(--gold-2); }
    .adm { display: grid; grid-template-columns: 230px 1fr; min-height: calc(100vh - 70px); }
    .adm-nav { background: #fff; border-right: 1px solid #dde0ee; padding: 16px 10px; display: flex; flex-direction: column; gap: 4px; }
    .adm-nav button { text-align: left; border: 0; background: none; padding: 10px 14px; border-radius: 10px; font-size: 15px; color: var(--ink); display: flex; justify-content: space-between; }
    .adm-nav button.on, .adm-nav button:hover { background: var(--cream-2); }
    .adm-nav .cnt { font-size: 12px; background: var(--night-2); color: #fff; border-radius: 999px; padding: 0 8px; }
    .adm-main { padding: 24px clamp(14px, 3vw, 36px); overflow-x: auto; }
    .adm-main h1 { font-family: var(--f-script); font-weight: 400; font-size: 46px; margin: 0 0 6px; }
    .bar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 16px; }
    .a-btn { padding: 8px 16px; border-radius: 10px; border: 1px solid #c9cde3; background: #fff; color: var(--ink); font-size: 14px; }
    .a-btn.pri { background: var(--night-2); color: #fff; border-color: var(--night-2); }
    .a-btn.gold { background: var(--gold); border-color: var(--gold-deep); }
    .a-btn.del { color: #b4233c; border-color: #f0c2cb; }
    .a-btn:hover { filter: brightness(1.05); box-shadow: 0 2px 8px rgba(0,0,0,.08); }
    table.adm-t { width: 100%; border-collapse: collapse; background: #fff; border-radius: 14px; overflow: hidden; box-shadow: 0 2px 10px rgba(20,30,80,.06); font-size: 14px; }
    .adm-t th { text-align: left; background: #f5f6fb; padding: 10px 12px; font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--ink-soft); }
    .adm-t td { padding: 10px 12px; border-top: 1px solid #eceef6; vertical-align: middle; }
    .adm-t td.act { white-space: nowrap; text-align: right; }
    .adm-t img { width: 44px; height: 44px; object-fit: cover; border-radius: 8px; }
    .adm-t tr.past td { opacity: .5; }
    .card { background: #fff; border-radius: 14px; padding: 20px; box-shadow: 0 2px 10px rgba(20,30,80,.06); max-width: 820px; }
    .form { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .form label { display: grid; gap: 4px; font-size: 13px; font-weight: 600; color: var(--ink-soft); }
    .form label.full { grid-column: 1 / -1; }
    .form input, .form select, .form textarea { padding: 9px 12px; border: 1px solid #c9cde3; border-radius: 10px; font: 15px var(--f-body); color: var(--ink); background: #fff; }
    .form .hint { font-weight: 400; font-size: 12px; opacity: .8; }
    .img-field { display: flex; gap: 8px; align-items: center; }
    .img-field input[type=text] { flex: 1; }
    .img-field img { width: 48px; height: 48px; object-fit: cover; border-radius: 8px; background: #eee; }
    .dlg { position: fixed; inset: 0; background: rgba(10, 16, 50, .55); display: none; place-items: center; z-index: 100; padding: 16px; }
    .dlg.open { display: grid; }
    .dlg .card { width: min(820px, 100%); max-height: 92vh; overflow: auto; }
    .dlg h2 { margin: 0 0 14px; }
    .note { background: #fff8e6; border: 1px solid #f1d48f; padding: 10px 14px; border-radius: 10px; font-size: 14px; margin-bottom: 16px; }
    .login { min-height: 100vh; display: grid; place-items: center; background: radial-gradient(ellipse at top, var(--night-3), var(--night-1)); }
    .login .card { width: min(380px, 92vw); text-align: center; }
    .login h1 { font-family: var(--f-script); font-weight: 400; font-size: 56px; margin: 0; color: var(--ink); }
    .login input { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #c9cde3; font-size: 16px; margin: 12px 0; }
    .pill { font-size: 12px; padding: 2px 8px; border-radius: 999px; background: #eef; }
    .pill.nová { background: #fff1c9; } .pill.vybavená { background: #d6f5e3; } .pill.zrušená { background: #fbd9df; }
    @media (max-width: 760px) { .adm { grid-template-columns: 1fr; } .adm-nav { flex-direction: row; overflow-x: auto; } .form { grid-template-columns: 1fr; } }
    .switches { display: grid; gap: 10px; }
    .switch { display: flex; align-items: center; gap: 12px; cursor: pointer; font-size: 15px; }
    .switch input { position: absolute; opacity: 0; pointer-events: none; }
    .switch .track { width: 46px; height: 26px; border-radius: 999px; background: #c9cde3; position: relative; transition: background .25s; flex: none; }
    .switch .knob { position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; box-shadow: 0 1px 4px rgba(0,0,0,.25); transition: transform .25s; }
    .switch input:checked + .track { background: #2e9d63; }
    .switch input:checked + .track .knob { transform: translateX(20px); }
    .switch input:focus-visible + .track { outline: 2px solid var(--night-3); outline-offset: 2px; }
    .switch .sw-state { margin-left: auto; font-size: 12px; font-weight: 600; color: #b4233c; }
    .switch .sw-state::after { content: "Vypnuté"; }
    .switch input:checked ~ .sw-state { color: #2e9d63; }
    .switch input:checked ~ .sw-state::after { content: "Zapnuté"; }
    .unsaved { color: #b4233c; font-size: 13px; font-weight: 600; }
  </style>
</head>
<body>
  <div id="app"></div>
  <script src="js/store.js"></script>
  <script src="js/magic.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
