# Nahratie webu na FTP hosting po každej zmene vo vetve main.
# Potrebné tajomstvá (GitHub → Settings → Secrets and variables → Actions):
#   FTP_SERVER     napr. ftp.dievcazobrazka.sk
#   FTP_USERNAME   používateľ FTP
#   FTP_PASSWORD   heslo FTP
#   FTP_DIR        priečinok webu na serveri, napr. /dievcazobrazka.sk/web/
#   ADMIN_PASSWORD heslo do administrácie webu
#   LUNA_SECRET    dlhý náhodný text (podpis prihlásenia do adminu)
# Nepovinné: FTP_PROTOCOL (sftp | ftps, predvolene sftp)
name: Nahrať web na FTP

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ftp-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
    steps:
      - name: Kontrola nastavení
        id: check
        env:
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_DIR: ${{ secrets.FTP_DIR }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          LUNA_SECRET: ${{ secrets.LUNA_SECRET }}
        run: |
          if [ -z "$FTP_SERVER" ]; then
            echo "::notice::Chýba tajomstvo FTP_SERVER – nahrávanie preskočené."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          missing=""
          for n in FTP_USERNAME FTP_PASSWORD FTP_DIR ADMIN_PASSWORD LUNA_SECRET; do
            [ -z "${!n}" ] && missing="$missing $n"
          done
          if [ -n "$missing" ]; then
            echo "::error::Chýbajú tajomstvá:$missing (Settings → Secrets and variables → Actions → Repository secrets)"
            exit 1
          fi
          echo "Všetky tajomstvá sú nastavené."

      - uses: actions/checkout@v4
        if: steps.check.outputs.skip != 'true'

      - name: Vytvoriť config.php s heslom do adminu
        if: steps.check.outputs.skip != 'true'
        env:
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          LUNA_SECRET: ${{ secrets.LUNA_SECRET }}
        run: |
          if [ -z "$ADMIN_PASSWORD" ]; then echo "::error::Chýba tajomstvo ADMIN_PASSWORD"; exit 1; fi
          if [ ${#LUNA_SECRET} -lt 16 ]; then echo "::error::Tajomstvo LUNA_SECRET chýba alebo je kratšie ako 16 znakov"; exit 1; fi
          php -r 'file_put_contents("config.php", "<?php\nconst ADMIN_PASSWORD = " . var_export(getenv("ADMIN_PASSWORD"), true) . ";\nconst SECRET = " . var_export(getenv("LUNA_SECRET"), true) . ";\n");'
          php -l config.php
          php -l api.php

      # Websupport má na FTP certifikát na *.r6.websupport.sk – zistíme meno servera
      # z IP adresy (PTR), aby sedel certifikát a mohla ostať plná kontrola.
      - name: Názov FTP servera podľa certifikátu
        id: host
        if: steps.check.outputs.skip != 'true'
        run: |
          ip=$(getent ahostsv4 "$FTP_SERVER" | awk 'NR==1{print $1}')
          ptr=$(dig +short -x "$ip" 2>/dev/null | sed 's/\.$//' | head -1)
          echo "PTR: ${ptr:-žiadny}"
          case "$ptr" in
            *.websupport.sk) echo "server=$ptr" >> "$GITHUB_OUTPUT"; echo "Použijem $ptr";;
          esac

      # SFTP (port 22) – jedno spojenie, spoľahlivejšie ako FTP/FTPS na Websupporte.
      # Nahráva len súbory webu; na serveri nič nemaže (data/ a uploads/ ostanú).
      - name: Nahrať na server (SFTP)
        if: steps.check.outputs.skip != 'true'
        env:
          HOST: ${{ steps.host.outputs.server || secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_DIR: ${{ secrets.FTP_DIR }}
          PROTO: ${{ secrets.FTP_PROTOCOL || 'sftp' }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp > /dev/null
          dir="${FTP_DIR#/}"            # cesta od domovského priečinka FTP účtu
          if [ "$PROTO" = "sftp" ]; then   # kľúč servera vopred (súbežné spojenia ho inak overujú naraz)
            mkdir -p ~/.ssh && ssh-keyscan -T 15 "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
          fi
          case "$PROTO" in
            sftp) url="sftp://$HOST"; extra="set sftp:auto-confirm yes;";;
            *)    url="ftp://$HOST";  extra="set ftp:ssl-force true; set ssl:check-hostname no;";;
          esac
          lftp -c "$extra set net:max-retries 4; set net:reconnect-interval-base 5; set net:timeout 30;
            open -u \"$FTP_USERNAME\" --env-password $url;
            mkdir -p -f \"$dir\";
            mirror --reverse --verbose --parallel=3 --no-perms \
              --exclude-glob .git* --exclude ^\.git/ --exclude ^\.github/ \
              --exclude-glob README.md --exclude-glob .DS_Store \
              ./ \"$dir\""
          echo "Hotovo – web nahraný do $FTP_DIR"
